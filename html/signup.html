<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="../style/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Comfortaa:wght@300..700&display=swap">
  </head>

  <body id="signup">
    <div class="container">
      <h1>Sign up page!</h1>

      <div class="block">
        <input type="text" class="text" placeholder="Email address">

        <input type="text" class="text" placeholder="Username">

        <input type="password" class="text" placeholder="Password">

        <input type="password" class="text" placeholder="Confirm password">
      </div>

      <div class="block">
        <button onclick="location.href='authorization.html'">Sign up</button>

        <span>
          <a>Already a member?</a>
          <a class="link" href="login.html">Log in</a>
        </span>
      </div>
    </div>
  </body>
</html>
